name: ci

on:
  push:
    branches: [main]
  pull_request:

# Lire le depot suffit : rien ici n'ecrit sur GitHub. Une action compromise
# n'aurait donc aucun jeton utile sous la main.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions epinglees au commit, pas au tag : un tag peut etre deplace sur
      # un autre commit, un SHA non.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Dependances systeme Tauri
        # Un miroir muet peut retenir apt une demi-heure sans rien dire. Les
        # reessais bornent l'attente, et l'etape rend la main au bout de dix
        # minutes plutot que de tenir le job jusqu'a la limite des six heures.
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -x
          # Le miroir Azure des runners tombe muet par moments : il accepte la
          # connexion et ne repond plus, et apt l'attend sans se plaindre. On
          # lui prefere l'archive officielle. Le remplacement porte sur tous
          # les fichiers de sources, quel que soit leur nom ou leur format :
          # viser un chemin precis, c'est rater le jour ou l'image en change.
          grep -rl 'azure.archive.ubuntu.com' /etc/apt/ 2>/dev/null \
            | sudo xargs -r sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g'
          # Les sources telles qu'apt les lira : sans cette trace, un echec ne
          # dit pas si le remplacement a porte.
          cat /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null | grep -i 'ubuntu.com' || true
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=15 \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      # Les trois fichiers de version doivent dire la meme chose : l'updater
      # compare la version installee a celle de la release, et un ecart les
      # ferait diverger sans que rien ne le signale.
      - run: node scripts/check-version.mjs
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
