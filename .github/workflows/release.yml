name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Rien par defaut : chaque job redemande ce dont il a besoin, et pas davantage.
permissions: {}

jobs:
  build:
    # L'environnement porte la cle de signature. Sa regle de deploiement
    # n'accepte que les tags `v*` : une branche de travail, une pull request ou
    # un fork ne peuvent pas s'en servir, meme en declenchant ce workflow.
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: "--bundles deb,rpm,appimage"
          - platform: windows-latest
            args: "--bundles nsis"
    runs-on: ${{ matrix.platform }}
    steps:
      # Actions epinglees au commit, pas au tag : un tag peut etre deplace sur
      # un autre commit, un SHA non. C'est ce qui empeche qu'une action
      # compromise s'execute ici avec la cle de signature a portee.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Dependances systeme Tauri
        if: matrix.platform == 'ubuntu-latest'
        # Un miroir muet peut retenir apt une demi-heure sans rien dire. Les
        # reessais bornent l'attente, et l'etape rend la main au bout de dix
        # minutes plutot que de tenir le job jusqu'a la limite des six heures.
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm libfuse2t64
      - run: npm ci
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sans ces deux valeurs, les artefacts sortent non signes et
          # l'application refusera de les installer : la cle publique est
          # inscrite dans `tauri.conf.json`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Chartographer ${{ github.ref_name }}"
          releaseBody: "Installeurs .deb, .rpm, .AppImage et .exe. Au premier lancement, colle un token Modrinth en lecture seule ; CurseForge ne demande rien. Les versions installees se mettent a jour toutes seules depuis cette page."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # La release reste un brouillon tant que les deux plateformes n'ont pas
  # abouti. Publier plus tot exposerait un `latest.json` ampute : les postes
  # dont l'installeur manque chercheraient une mise a jour qui n'existe pas.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      # Sur un brouillon, tauri-action ne connait pas encore l'adresse publique
      # des fichiers : il inscrit dans `latest.json` l'URL de l'API GitHub, qui
      # ne rend le binaire qu'a qui demande `Accept: application/octet-stream`.
      # L'updater ne le demande pas — il recevrait du JSON, et la verification
      # de signature echouerait. On recrit donc les adresses en liens de
      # telechargement avant de publier, tant que rien n'est encore visible.
      - name: Recrire les adresses de latest.json
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern latest.json --output latest.json
          # `releases/tags/{tag}` ignore les brouillons : on parcourt la liste,
          # qui les contient, et on retient celui qui porte ce tag.
          gh api "repos/$GH_REPO/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .assets[] | \"\(.id)\t\(.name)\"" > assets.tsv
          test -s assets.tsv
          while IFS=$'\t' read -r id name; do
            encoded=$(jq -rn --arg n "$name" '$n|@uri')
            sed -i \
              "s#https://api.github.com/repos/$GH_REPO/releases/assets/$id#https://github.com/$GH_REPO/releases/download/$TAG/$encoded#g" \
              latest.json
          done < assets.tsv
          if grep -q 'api.github.com' latest.json; then
            echo "Des adresses d'API subsistent dans latest.json :" >&2
            cat latest.json >&2
            exit 1
          fi
          cat latest.json
          gh release upload "$TAG" latest.json --clobber

      - name: Publier la release
        run: gh release edit "$TAG" --draft=false --latest
