name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Rien par defaut : chaque job redemande ce dont il a besoin, et pas davantage.
permissions: {}

jobs:
  build:
    # L'environnement porte la cle de signature. Sa regle de deploiement
    # n'accepte que les tags `v*` : une branche de travail, une pull request ou
    # un fork ne peuvent pas s'en servir, meme en declenchant ce workflow.
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: "--bundles deb,rpm,appimage"
          - platform: windows-latest
            args: "--bundles nsis"
    runs-on: ${{ matrix.platform }}
    steps:
      # Actions epinglees au commit, pas au tag : un tag peut etre deplace sur
      # un autre commit, un SHA non. C'est ce qui empeche qu'une action
      # compromise s'execute ici avec la cle de signature a portee.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Dependances systeme Tauri
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm libfuse2
      - run: npm ci
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sans ces deux valeurs, les artefacts sortent non signes et
          # l'application refusera de les installer : la cle publique est
          # inscrite dans `tauri.conf.json`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Chartographer ${{ github.ref_name }}"
          releaseBody: "Installeurs .deb, .rpm, .AppImage et .exe. Au premier lancement, colle un token Modrinth en lecture seule ; CurseForge ne demande rien. Les versions installees se mettent a jour toutes seules depuis cette page."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # La release reste un brouillon tant que les deux plateformes n'ont pas
  # abouti. Publier plus tot exposerait un `latest.json` ampute : les postes
  # dont l'installeur manque chercheraient une mise a jour qui n'existe pas.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publier la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --latest
