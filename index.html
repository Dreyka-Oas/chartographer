<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chartographer</title>
    <!--
      Le thème est posé avant la première peinture, par un fichier servi à part :
      la politique de sécurité de contenu refuse les scripts en ligne. Voir
      `public/theme-boot.js`.

      Les deux fonds ci-dessous sont recopiés ici pour la même raison qu'il
      existe, ce sont les `--bg` de `app.css`, qui n'est chargé qu'avec le
      module.
    -->
    <script src="/theme-boot.js"></script>
    <style>
      :root {
        background-color: #efece4;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          background-color: #0a1114;
        }
      }
      :root[data-theme="dark"] {
        background-color: #0a1114;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
