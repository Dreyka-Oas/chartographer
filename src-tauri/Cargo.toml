[package]
name = "chartographer"
version = "0.2.2"
edition = "2021"
rust-version = "1.85"

[lib]
name = "chartographer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-opener = "2.5"
tauri-plugin-process = "2.3"
tauri-plugin-updater = "2.10"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.13", features = ["json", "multipart"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.42", features = ["serde-with-str"] }
strsim = "0.11"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Vérifie, dans `tests/verify_release.rs`, que l'archive publiée porte bien la
# signature de la clé du projet — la même bibliothèque que celle dont se sert
# l'updater pour refuser tout le reste.
minisign-verify = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
